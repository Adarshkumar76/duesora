services:
  postgres:
    image: postgres:16-alpine
    container_name: duesora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duesora
      POSTGRES_PASSWORD: duesora
      POSTGRES_DB: duesora
    ports:
      - "5432:5432"
    volumes:
      - duesora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duesora -d duesora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: duesora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - duesora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  duesora_postgres_data:
  duesora_redis_data: