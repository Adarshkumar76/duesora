services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duesora-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://duesora:duesora@postgres:5432/duesora
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=${AUTH_SECRET:-replace-with-a-long-random-secret}
      - AUTH_TRUST_HOST=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-replace-with-a-dedicated-encryption-key}
      - CRON_SECRET=${CRON_SECRET:-replace-with-a-secure-cron-secret}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - duesora_uploads:/app/data/uploads

  postgres:
    image: postgres:16-alpine
    container_name: duesora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duesora
      POSTGRES_PASSWORD: duesora
      POSTGRES_DB: duesora
    ports:
      - "5432:5432"
    volumes:
      - duesora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duesora -d duesora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: duesora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - duesora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  duesora_postgres_data:
  duesora_redis_data:
  duesora_uploads: